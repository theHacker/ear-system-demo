workflow:
  auto_cancel:
    on_new_commit: conservative

stages:
  - check
  - test
  - build

lint-frontend:
  image: oven/bun:1.3.5
  stage: check
  interruptible: true
  script: cd frontend && bun i && bun run lint

typecheck-frontend:
  image: oven/bun:1.3.5
  stage: check
  interruptible: true
  script: cd frontend && bun i && bun run typecheck

test-backend:
  image: gradle:9.8.2-jdk21-alpine
  stage: test
  interruptible: true
  script: cd backend && gradle check
  artifacts:
    when: always
    paths:
      - backend/build/reports/
      - backend/build/test-results/
    reports:
      junit: backend/build/test-results/test/TEST-*.xml

build-frontend:
  image: oven/bun:1.3.5
  stage: build
  interruptible: true
  script: cd frontend && bun i && bun run build
  dependencies: []  # don't need the test artifacts
  artifacts:
    paths:
      - frontend/.output/public/
